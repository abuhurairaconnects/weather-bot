services:
  - type: web
    name: telegram-weather-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_LANGUAGE
        value: bn
      - key: DEFAULT_TEMP_UNIT
        value: C
      - key: TIMEZONE
        value: Asia/Dhaka
